name: Build MazehDasht Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'MazehDashtAndroid_v1.1.0_SourceProject-2.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q MazehDashtAndroid_v1.1.0_SourceProject-2.zip -d source
          find source -name settings.gradle.kts -print

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(find source -name settings.gradle.kts -printf '%h\n' | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project settings.gradle.kts not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MazehDasht-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
